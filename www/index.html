  <main class="main">

    <!-- Hero Section -->
    <section id="hero" class="hero section">
      <div class="container px-4" data-aos="fade-up" data-aos-delay="100">

        <div class="card shadow-sm border-0 mx-auto"
          style="max-width: 500px; background-color: rgba(20, 20, 20, 0.08); border: 3px solid #dee2e6; border-radius: 14px;">

            <h4 class="text-center mb-4 fs-6 text-muted">Enter Your Login Details</h4>

            <form id="loginForm" class="row g-3 needs-validation" novalidate>

              <div class="col-12">
                <label for="loginUsername" class="form-label">Username</label>
                <div class="input-group has-validation">
                  <span class="input-group-text" id="inputGroupPrepend">@</span>
                  <input type="text" class="form-control" id="loginUsername" name="username"
                    aria-describedby="inputGroupPrepend" required>
                  <div class="invalid-feedback">Please enter your username.</div>
                </div>
              </div>

              <div class="col-12">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" name="password" required>
                <div class="invalid-feedback">Please enter your password.</div>
              </div>

              <div class="col-12 mt-2">
                <a href="signUp.html" class="text-decoration-none">Create Account</a>
              </div>

              <div class="col-12 mt-4">
                <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">
                  Sign in
                </button>
              </div>

            </form>

          </div>

      </div>
